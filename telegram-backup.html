<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#f4f7f5" />
    <title>Պահուստավորել արդյունքները</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, "Noto Sans Armenian", sans-serif;
        color: #18302b;
        background: #f4f7f5;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        place-items: center;
      }

      main {
        width: min(100%, 480px);
        padding: 28px;
        border: 1px solid #dce5e1;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(27, 58, 48, 0.1);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #17865f;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 7vw, 34px);
        line-height: 1.2;
      }

      #summary {
        margin: 16px 0 22px;
        color: #64746f;
        font-size: 15px;
      }

      button {
        width: 100%;
        min-height: 54px;
        padding: 12px 18px;
        border: 0;
        border-radius: 12px;
        background: #17865f;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        cursor: pointer;
      }

      button:disabled {
        background: #aab8b2;
        cursor: not-allowed;
      }

      #status {
        min-height: 24px;
        margin: 16px 0 0;
        color: #64746f;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      #status.error { color: #c83d4a; }

      a {
        display: inline-block;
        margin-top: 18px;
        color: #0f6849;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Կենսաբանության փորձնական թեստ</p>
      <h1>Պահուստավորել Telegram-ում</h1>
      <p id="summary">Ստուգվում է պահպանված պատմությունը…</p>
      <button id="sendBackup" type="button">Ուղարկել JSON-ը Telegram</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a href="./?v=20261110-1">Վերադառնալ թեստերին</a>
    </main>

    <script>
      (() => {
        "use strict";

        const HISTORY_KEY = "biology-practice-history-v1";
        const TELEGRAM_BOT_TOKEN = "6485075892:AAG1DkibXjLXJBdD-BEueF16joOJjAvN6XA";
        const TELEGRAM_CHAT_ID = "905996750";
        const button = document.querySelector("#sendBackup");
        const summary = document.querySelector("#summary");
        const status = document.querySelector("#status");

        function readHistory() {
          try {
            const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY));
            return Array.isArray(parsed) ? parsed : [];
          } catch {
            return [];
          }
        }

        function setStatus(message, isError = false) {
          status.textContent = message;
          status.classList.toggle("error", isError);
        }

        const savedHistory = readHistory();
        summary.textContent = savedHistory.length
          ? `Պահպանված է ${savedHistory.length} ավարտված փորձ։ Պահուստային պատճենը կուղարկվի ձեր Telegram զրույցին։`
          : "Այս դիտարկչում ավարտված թեստերի պատմություն չկա։";
        button.disabled = savedHistory.length === 0;

        button.addEventListener("click", async () => {
          const attempts = readHistory();
          if (!attempts.length) {
            setStatus("Ուղարկելու համար պահպանված փորձեր չկան։", true);
            button.disabled = true;
            return;
          }

          button.disabled = true;
          button.textContent = "Ուղարկվում է…";
          setStatus("Պատմության պահուստային ֆայլն ուղարկվում է Telegram։");
          try {
            const backup = {
              format: "biology-practice-history",
              version: 1,
              exportedAt: new Date().toISOString(),
              attempts,
            };
            const file = new File(
              [JSON.stringify(backup, null, 2)],
              `emis-test-history-${new Date().toISOString().slice(0, 10)}.json`,
              { type: "application/json" },
            );
            const body = new FormData();
            body.append("chat_id", TELEGRAM_CHAT_ID);
            body.append("document", file);
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, {
              method: "POST",
              body,
            });
            const result = await response.json();
            if (!result.ok) throw new Error(result.description || "Telegram-ը չընդունեց ֆայլը։");
            setStatus(`Ուղարկվեց Telegram։ Արխիվում ներառված է ${attempts.length} փորձ։`);
          } catch (error) {
            setStatus(`Ուղարկումը չհաջողվեց։ ${error.message}`, true);
          } finally {
            button.disabled = false;
            button.textContent = "Կրկին ուղարկել JSON-ը";
          }
        });
      })();
    </script>
  </body>
</html>
